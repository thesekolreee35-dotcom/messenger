<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Messenger Call</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        /* Чистые шрифты и глубокие кобальтовые оттенки */
        :root {
            --bg-base: #060913; 
            --bg-cobalt: #0d1424; 
            --bg-cobalt-light: #162038;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #e11d48;
            --success: #10b981;
            --shadow-heavy: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            overflow: hidden;
        }

        .call-wrapper { 
            background-color: var(--bg-cobalt); 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: var(--shadow-heavy); 
            width: 850px; 
            max-width: 95%; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        h2 { 
            margin-top: 0; 
            text-align: center; 
            color: var(--text-main); 
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .id-panel { 
            background-color: var(--bg-cobalt-light); 
            padding: 18px; 
            border-radius: 16px; 
            text-align: center; 
            margin-bottom: 25px; 
        }

        #my-id { 
            color: var(--accent-blue); 
            font-weight: 700; 
            font-family: 'JetBrains Mono', monospace; 
            background: rgba(0,0,0,0.3); 
            padding: 6px 10px; 
            border-radius: 6px; 
            user-select: all;
            margin-left: 10px;
        }

        .controls-panel { 
            display: flex; 
            gap: 12px; 
            justify-content: center; 
            margin-bottom: 15px; 
        }

        input, button { 
            padding: 14px 20px; 
            border-radius: 12px; 
            border: none; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        input { 
            background-color: rgba(0,0,0,0.3); 
            color: var(--text-main); 
            flex-grow: 1; 
            max-width: 320px; 
            border: 1px solid transparent; 
        }

        input:focus { 
            border-color: var(--accent-blue); 
            background-color: rgba(0,0,0,0.5);
        }

        button { 
            background-color: var(--accent-blue); 
            color: white; 
            cursor: pointer; 
            font-weight: 600; 
            min-width: 140px; 
        }

        button:hover:not(:disabled) { 
            background-color: var(--accent-hover); 
            transform: translateY(-2px);
        }

        button:active:not(:disabled) { 
            transform: translateY(1px); 
        }

        button:disabled { 
            background-color: var(--bg-cobalt-light); 
            color: var(--text-muted); 
            cursor: not-allowed; 
        }

        #status-text { 
            text-align: center; 
            font-size: 14px; 
            color: var(--text-muted); 
            min-height: 20px; 
            margin-bottom: 25px; 
        }

        .video-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 24px; 
        }

        .video-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background-color: #000; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); 
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            background: #000; 
        }

        .video-label { 
            position: absolute; 
            bottom: 12px; 
            left: 12px; 
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(4px);
            padding: 6px 12px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 500;
            z-index: 10; 
        }

        /* --- Меню входящего звонка (с инерционной анимацией) --- */
        .incoming-call-modal {
            position: absolute;
            top: 20px;
            left: 50%;
            /* Стартовая позиция для появления с отставанием */
            transform: translateX(-50%) translateY(-100px) scale(0.95);
            opacity: 0;
            pointer-events: none;
            background: var(--bg-cobalt-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Плавная настройка инерции: пружинит в конце */
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }

        .incoming-call-modal.active {
            transform: translateX(-50%) translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .incoming-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-accept { background-color: var(--success); }
        .btn-accept:hover:not(:disabled) { background-color: #059669; }
        
        .btn-decline { background-color: var(--danger); }
        .btn-decline:hover:not(:disabled) { background-color: #be123c; }

    </style>
</head>
<body>

<div class="call-wrapper">
    <!-- Кастомное окно для входящего звонка -->
    <div class="incoming-call-modal" id="incoming-modal">
        <div class="incoming-title">Входящий видеозвонок!</div>
        <div class="modal-buttons">
            <button class="btn-accept" id="btn-accept">Принять</button>
            <button class="btn-decline" id="btn-decline">Отклонить</button>
        </div>
    </div>

    <h2>Видеосвязь P2P</h2>
    
    <div class="id-panel">
        Твой ID: <span id="my-id">Подключение...</span>
    </div>

    <div class="controls-panel">
        <input type="text" id="partner-id" placeholder="Введи ID друга..." autocomplete="off">
        <button id="call-btn">Позвонить</button>
    </div>
    
    <div id="status-text">Инициализация оборудования...</div>

    <div class="video-grid">
        <div class="video-container">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="video-label">Вы (Локально)</div>
        </div>
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <div class="video-label">Собеседник</div>
        </div>
    </div>
</div>

<script>
    let localStream = null;
    let currentIncomingCall = null; // Храним входящий вызов

    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const myIdSpan = document.getElementById('my-id');
    const partnerIdInput = document.getElementById('partner-id');
    const callBtn = document.getElementById('call-btn');
    const statusText = document.getElementById('status-text');
    
    const incomingModal = document.getElementById('incoming-modal');
    const btnAccept = document.getElementById('btn-accept');
    const btnDecline = document.getElementById('btn-decline');

    const peer = new Peer({
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    });

    peer.on('error', err => {
        statusText.textContent = 'Ошибка сети: ' + err.type;
        resetCallButton();
    });

    peer.on('open', id => {
        myIdSpan.textContent = id;
        statusText.textContent = 'Готов к звонку. Введи ID друга.';
        callBtn.disabled = false;
    });

    // Запрашиваем камеру
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStream = stream;
            localVideo.srcObject = stream;
            statusText.textContent = 'Камера подключена.';
        } catch (err) {
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localStream = audioStream;
                statusText.textContent = 'Режим аудио (камера недоступна).';
            } catch (audioErr) {
                statusText.textContent = 'Нет доступа к камере и микрофону.';
            }
        }
    }
    startCamera();

    // ИСХОДЯЩИЙ ЗВОНОК
    callBtn.addEventListener('click', () => {
        const partnerId = partnerIdInput.value.trim();
        if (!partnerId) return;

        callBtn.disabled = true;
        callBtn.textContent = 'Звоним...';
        statusText.textContent = 'Ожидание ответа от ' + partnerId + '...';

        const streamToSend = localStream || new MediaStream();
        const call = peer.call(partnerId, streamToSend);

        if (!call) {
            statusText.textContent = 'Ошибка вызова.';
            resetCallButton();
            return;
        }

        call.on('stream', remoteStream => {
            remoteVideo.srcObject = remoteStream;
            statusText.textContent = 'В эфире!';
            callBtn.textContent = 'Связь установлена';
        });

        call.on('error', () => {
            statusText.textContent = 'Сбой вызова.';
            resetCallButton();
        });
        
        call.on('close', () => {
            statusText.textContent = 'Звонок завершен.';
            resetCallButton();
            remoteVideo.srcObject = null;
        });
    });

    // ВХОДЯЩИЙ ЗВОНОК (Теперь с красивым интерфейсом)
    peer.on('call', call => {
        currentIncomingCall = call;
        // Плавно показываем кастомное окно
        incomingModal.classList.add('active');
        statusText.textContent = 'Входящий звонок...';
    });

    // Кнопка ПРИНЯТЬ в интерфейсе
    btnAccept.addEventListener('click', () => {
        incomingModal.classList.remove('active'); // Прячем окно
        
        if (currentIncomingCall) {
            currentIncomingCall.answer(localStream || new MediaStream());
            
            currentIncomingCall.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
                statusText.textContent = 'В эфире!';
                callBtn.disabled = true;
                callBtn.textContent = 'Связь установлена';
            });

            currentIncomingCall.on('close', () => {
                statusText.textContent = 'Звонок завершен.';
                resetCallButton();
                remoteVideo.srcObject = null;
            });
        }
    });

    // Кнопка ОТКЛОНИТЬ в интерфейсе
    btnDecline.addEventListener('click', () => {
        incomingModal.classList.remove('active'); // Прячем окно
        if (currentIncomingCall) {
            currentIncomingCall.close();
            statusText.textContent = 'Звонок отклонен.';
        }
    });

    function resetCallButton() {
        callBtn.disabled = false;
        callBtn.textContent = 'Позвонить';
    }
</script>

</body>
</html>
