<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Developer Style - P2P Node</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #161618;
            --surface-elevated: #1e1e20;
            --border-color: #333336;
            --text-main: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #0066CC;
            --accent-hover: #0077ED;
            --danger: #ff453a;
            --success: #30d158;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Верхняя панель навигации в стиле Apple Developer */
        header.app-header {
            height: 64px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-main);
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--danger);
        }

        .status-dot.active {
            background-color: var(--success);
        }

        /* Основной контейнер на весь экран */
        .app-workspace {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            padding: 24px 32px;
            background-color: var(--bg-color);
            height: calc(100vh - 64px);
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        /* Карточки-секции */
        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Панель управления звонком */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .id-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .id-box {
            background-color: var(--surface-elevated);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-family: ui-monospace, monospace;
            font-size: 13px;
            color: var(--text-main);
            user-select: all;
        }

        /* Инпуты и Кнопки */
        input[type="text"] {
            background-color: var(--surface-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-danger {
            background-color: rgba(255, 69, 58, 0.2);
            color: var(--danger);
        }

        .btn-danger:hover:not(:disabled) {
            background-color: rgba(255, 69, 58, 0.3);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Сетка видео */
        .video-grid {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 16px;
            flex-grow: 1;
            min-height: 0;
        }

        .video-wrapper {
            background-color: #0b0b0d;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 14px;
            left: 14px;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Правая колонка: Чат */
        .chat-card {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
        }

        .messages-container {
            flex-grow: 1;
            background-color: var(--surface-elevated);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
        }

        .message-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 85%;
        }

        .message-item.self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .bubble {
            background-color: #2c2c2e;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-item.self .bubble {
            background-color: var(--accent);
            color: #fff;
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-title">Apple Developer Node Environment</div>
        <div class="system-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Инициализация...</span>
        </div>
    </header>

    <main class="app-workspace">
        <!-- Левая колонка: Управление и Видео -->
        <div class="column">
            <div class="card">
                <div class="id-row">
                    <span>Ваш уникальный ID узла:</span>
                    <span class="id-box" id="my-id">Генерация...</span>
                </div>
                <div class="control-panel">
                    <input type="text" id="target-id" placeholder="Введите ID собеседника для вызова..." autocomplete="off">
                    <button class="btn" id="btn-call" disabled>Вызов</button>
                </div>
            </div>

            <div class="video-grid">
                <div class="video-wrapper">
                    <span class="video-label">Локальная камера (Вы)</span>
                    <video id="local-video" autoplay muted playsinline></video>
                </div>
                <div class="video-wrapper">
                    <span class="video-label">Удаленный поток (Собеседник)</span>
                    <video id="remote-video" autoplay playsinline></video>
                </div>
            </div>

            <div>
                <button class="btn btn-danger" id="btn-hangup" disabled style="width: 100%;">Завершить сессию</button>
            </div>
        </div>

        <!-- Правая колонка: Защищенный чат -->
        <div class="column">
            <div class="card chat-card">
                <div class="card-title">Защищенный чат сессии</div>
                <div class="messages-container" id="messages-container">
                    <div class="message-item">
                        <div class="bubble" style="color: var(--text-secondary); background: transparent; border: 1px solid var(--border-color);">Система готова к обмену сообщениями. Ожидание подключения узла...</div>
                    </div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Введите сообщение..." disabled>
                    <button class="btn" id="btn-send" disabled>Отпр.</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        class P2PApp {
            constructor() {
                this.peer = null;
                this.localStream = null;
                this.currentCall = null;
                this.dataConnection = null;

                this.initDOM();
                this.initPeer();
                this.initMedia();
                this.initEvents();
            }

            initDOM() {
                this.dom = {
                    myId: document.getElementById('my-id'),
                    targetId: document.getElementById('target-id'),
                    btnCall: document.getElementById('btn-call'),
                    btnHangup: document.getElementById('btn-hangup'),
                    localVideo: document.getElementById('local-video'),
                    remoteVideo: document.getElementById('remote-video'),
                    messagesContainer: document.getElementById('messages-container'),
                    chatInput: document.getElementById('chat-input'),
                    btnSend: document.getElementById('btn-send'),
                    statusDot: document.getElementById('status-dot'),
                    statusText: document.getElementById('status-text')
                };
            }

            initPeer() {
                this.peer = new Peer({
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });

                this.peer.on('open', id => {
                    this.dom.myId.textContent = id;
                    this.setStatus(true, 'Узел активен, ожидает вызова');
                    this.dom.btnCall.disabled = false;
                });

                this.peer.on('error', err => {
                    this.setStatus(false, `Ошибка: ${err.type}`);
                });

                this.peer.on('call', call => {
                    this.currentCall = call;
                    call.answer(this.localStream || new MediaStream());
                    this.bindCallEvents(call);
                });

                this.peer.on('connection', conn => {
                    this.setupDataConnection(conn);
                });
            }

            async initMedia() {
                try {
                    this.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    this.dom.localVideo.srcObject = this.localStream;
                } catch (e) {
                    this.setStatus(false, 'Камера недоступна (аудио/текст режим)');
                }
            }

            initEvents() {
                this.dom.btnCall.addEventListener('click', () => {
                    const id = this.dom.targetId.value.trim();
                    if (!id) return;

                    this.dom.btnCall.disabled = true;
                    this.dom.targetId.disabled = true;
                    this.setStatus(true, `Установка связи с ${id}...`);

                    const call = this.peer.call(id, this.localStream || new MediaStream());
                    this.currentCall = call;
                    this.bindCallEvents(call);

                    const conn = this.peer.connect(id);
                    this.setupDataConnection(conn);
                });

                this.dom.btnHangup.addEventListener('click', () => this.terminate());

                this.dom.btnSend.addEventListener('click', () => this.sendMessage());
                this.dom.chatInput.addEventListener('keypress', e => {
                    if (e.key === 'Enter') this.sendMessage();
                });
            }

            bindCallEvents(call) {
                call.on('stream', remoteStream => {
                    this.dom.remoteVideo.srcObject = remoteStream;
                    this.dom.btnHangup.disabled = false;
                    this.setStatus(true, 'Защищенное соединение установлено');
                });
                call.on('close', () => this.terminate());
                call.on('error', () => this.terminate());
            }

            setupDataConnection(conn) {
                this.dataConnection = conn;
                conn.on('open', () => {
                    this.dom.chatInput.disabled = false;
                    this.dom.btnSend.disabled = false;
                    this.addSystemMessage('Канал чата успешно открыт.');
                });
                conn.on('data', data => {
                    this.appendMessage(data.text, data.time, false);
                });
                conn.on('close', () => {
                    this.addSystemMessage('Канал чата закрыт собеседником.');
                });
            }

            sendMessage() {
                const text = this.dom.chatInput.value.trim();
                if (!text || !this.dataConnection) return;

                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                this.dataConnection.send({ text, time });
                this.appendMessage(text, time, true);
                this.dom.chatInput.value = '';
            }

            appendMessage(text, time, isSelf) {
                const div = document.createElement('div');
                div.className = `message-item ${isSelf ? 'self' : ''}`;
                div.innerHTML = `
                    <div class="bubble">${this.escape(text)}</div>
                    <div class="msg-time">${time}</div>
                `;
                this.dom.messagesContainer.appendChild(div);
                this.dom.messagesContainer.scrollTop = this.dom.messagesContainer.scrollHeight;
            }

            addSystemMessage(text) {
                const div = document.createElement('div');
                div.className = 'message-item';
                div.innerHTML = `<div class="bubble" style="color: var(--text-secondary); background: transparent; border: 1px solid var(--border-color);">${this.escape(text)}</div>`;
                this.dom.messagesContainer.appendChild(div);
                this.dom.messagesContainer.scrollTop = this.dom.messagesContainer.scrollHeight;
            }

            terminate() {
                if (this.currentCall) { this.currentCall.close(); this.currentCall = null; }
                if (this.dataConnection) { this.dataConnection.close(); this.dataConnection = null; }

                this.dom.remoteVideo.srcObject = null;
                this.dom.btnCall.disabled = false;
                this.dom.targetId.disabled = false;
                this.dom.btnHangup.disabled = true;
                this.dom.chatInput.disabled = true;
                this.dom.btnSend.disabled = true;
                this.setStatus(true, 'Сессия завершена. Ожидание вызова');
            }

            setStatus(active, text) {
                if (active) this.dom.statusDot.classList.add('active');
                else this.dom.statusDot.classList.remove('active');
                this.dom.statusText.textContent = text;
            }

            escape(str) {
                return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new P2PApp();
        });
    </script>
</body>
</html>
