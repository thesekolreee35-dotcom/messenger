<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceTime & Messages P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --apple-bg: #000000;
            --glass-surface: rgba(255, 255, 255, 0.05);
            --glass-surface-hover: rgba(255, 255, 255, 0.09);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-light: rgba(255, 255, 255, 0.2);
            --cobalt-blue: #0066CC;
            --cobalt-hover: #0077ED;
            --text-primary: #F5F5F7;
            --text-secondary: #86868B;
            --spring-easing: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
            background-color: var(--apple-bg);
            /* Стильные мягкие градиенты на фоне в стиле macOS Sonoma */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 102, 204, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(88, 86, 214, 0.2) 0%, transparent 40%);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Главное окно на весь экран в стиле macOS */
        .macos-window {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            width: 1300px;
            max-width: 96vw;
            height: 85vh;
            background: rgba(22, 22, 24, 0.65);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
        }

        /* Верхняя панель управления звонком */
        .control-bar {
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
        }

        .id-container {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        #my-id {
            color: var(--text-primary);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            user-select: all;
            border: 1px solid var(--glass-border);
        }

        .connect-group {
            display: flex;
            gap: 10px;
        }

        input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            width: 220px;
        }

        input:focus {
            border-color: var(--cobalt-blue);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.3);
        }

        /* Динамичные кнопки Apple Style */
        button {
            background: var(--cobalt-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.4s var(--spring-easing), background-color 0.2s ease, box-shadow 0.4s var(--spring-easing);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        button:hover:not(:disabled) {
            background: var(--cobalt-hover);
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(0, 102, 204, 0.5);
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Видео сетка в стиле FaceTime */
        .video-grid {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 16px;
            flex-grow: 1;
        }

        .video-box {
            position: relative;
            background: #0b0b0d;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-tag {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* ПРАВАЯ ПАНЕЛЬ: Профиль и Чат (Messages Style) */
        .chat-pane {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--glass-border);
        }

        .avatar-wrapper {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--glass-border-light);
            cursor: pointer;
            transition: transform 0.4s var(--spring-easing);
        }

        .avatar-wrapper:hover {
            transform: scale(1.08);
            border-color: var(--cobalt-blue);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-wrapper input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .messages-area {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: none;
        }
        .messages-area::-webkit-scrollbar { display: none; }

        .chat-message {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-message.self {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .bubble {
            background: var(--glass-surface-hover);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: 14px 14px 14px 4px;
            font-size: 13px;
            max-width: 75%;
            line-height: 1.4;
        }

        .chat-message.self .bubble {
            background: var(--cobalt-blue);
            border-color: transparent;
            border-radius: 14px 14px 4px 14px;
        }

        .chat-input-bar {
            display: flex;
            gap: 8px;
        }

        .chat-input-bar input {
            width: 100%;
        }
    </style>
</head>
<body>

<div class="macos-window">
    <!-- ЛЕВАЯ КОЛОНКА: Звонки -->
    <div class="pane">
        <div class="control-bar">
            <div class="id-container">ID: <span id="my-id">Генерация...</span></div>
            <div class="connect-group">
                <input type="text" id="partner-id" placeholder="ID собеседника..." autocomplete="off">
                <button id="call-btn">Вызов</button>
            </div>
        </div>

        <div class="video-grid">
            <div class="video-box">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="video-tag">Вы</div>
            </div>
            <div class="video-box">
                <video id="remote-video" autoplay playsinline></video>
                <div class="video-tag">Собеседник</div>
            </div>
        </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА: Профиль и Чат -->
    <div class="pane chat-pane">
        <div class="profile-card">
            <div class="avatar-wrapper" title="Изменить фото профиля">
                <img id="profile-pic" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2ZmZmZmZiI+PHBhdGggZD0iTTEyIDJDMi40OCAyIDEyIDExLjUyIDEyIDIyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMyMS41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTQuMmMtMi41IDAtNC43MS0xLjI4LTYtMy4yMi4wMy0xLjk5IDQtMy4wOCA2LTMuMDggMi4wMSAwIDUuOTcgMS4wOSA2IDMuMDgtMS4yOSAxLjk0LTMuNSAzLjIyLTYgMy4yMnoiLz48L3N2Zz4=">
                <input type="file" id="avatar-file" accept="image/*">
            </div>
            <div>
                <div style="font-size: 14px; font-weight: 600;">Ваш профиль</div>
                <div style="font-size: 11px; color: var(--text-secondary);" id="connection-status">Ожидание связи</div>
            </div>
        </div>

        <div class="messages-area" id="messages-area">
            <!-- Сообщения чата -->
        </div>

        <div class="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Сообщение..." disabled>
            <button id="send-btn" disabled>Отпр.</button>
        </div>
    </div>
</div>

<script>
    let localStream = null;
    let dataConnection = null;
    let currentAvatar = document.getElementById('profile-pic').src;

    const myIdSpan = document.getElementById('my-id');
    const partnerInput = document.getElementById('partner-id');
    const callBtn = document.getElementById('call-btn');
    const statusText = document.getElementById('connection-status');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    
    const avatarFile = document.getElementById('avatar-file');
    const profilePic = document.getElementById('profile-pic');
    const messagesArea = document.getElementById('messages-area');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    const peer = new Peer();

    peer.on('open', id => {
        myIdSpan.textContent = id;
    });

    // Камера
    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
        localStream = stream;
        localVideo.srcObject = stream;
    }).catch(() => {
        statusText.textContent = 'Камера недоступна (аудиорежим)';
    });

    // Аватарка
    avatarFile.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = ev => {
                currentAvatar = ev.target.result;
                profilePic.src = currentAvatar;
            };
            reader.readAsDataURL(file);
        }
    });

    function addMessage(text, avatar, isSelf) {
        const div = document.createElement('div');
        div.className = `chat-message ${isSelf ? 'self' : ''}`;
        div.innerHTML = `
            <img src="${avatar}" class="msg-avatar">
            <div class="bubble">${text}</div>
        `;
        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function initDataConn(conn) {
        dataConnection = conn;
        conn.on('open', () => {
            chatInput.disabled = false;
            sendBtn.disabled = false;
            statusText.textContent = 'В сети (защищено)';
            addMessage('Защищенный чат активен.', currentAvatar, false);
        });
        conn.on('data', data => {
            addMessage(data.text, data.avatar, false);
        });
    }

    sendBtn.addEventListener('click', () => {
        const text = chatInput.value.trim();
        if (text && dataConnection) {
            dataConnection.send({ text, avatar: currentAvatar });
            addMessage(text, currentAvatar, true);
            chatInput.value = '';
        }
    });

    chatInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') sendBtn.click();
    });

    // Исходящий вызов
    callBtn.addEventListener('click', () => {
        const id = partnerInput.value.trim();
        if (!id) return;

        callBtn.disabled = true;
        callBtn.textContent = 'Звонок...';

        const call = peer.call(id, localStream || new MediaStream());
        const conn = peer.connect(id);
        initDataConn(conn);

        call.on('stream', remoteStream => {
            remoteVideo.srcObject = remoteStream;
            callBtn.textContent = 'Связь ОК';
            statusText.textContent = 'Видеовызов активен';
        });
    });

    // Входящий вызов
    peer.on('call', call => {
        if (confirm('Принять входящий звонок?')) {
            call.answer(localStream || new MediaStream());
            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
                callBtn.textContent = 'Связь ОК';
                statusText.textContent = 'Видеовызов активен';
            });
        }
    });

    peer.on('connection', conn => {
        initDataConn(conn);
    });
</script>

</body>
</html>
