<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus P2P Secure Node</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #06080c;
            --surface-color: #10141d;
            --surface-elevated: #181f2d;
            --border-color: #222b3d;
            --text-main: #f3f6fc;
            --text-secondary: #8190a8;
            --accent: #2f54eb;
            --accent-hover: #1d39c4;
            --danger: #ff4d4f;
            --success: #52c41a;
            --radius-outer: 24px;
            --radius-inner: 16px;
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Шапка */
        header.app-header {
            height: 64px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            flex-shrink: 0;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--text-main);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--danger);
            transition: background-color 0.3s;
        }

        .status-dot.active {
            background-color: var(--success);
        }

        /* Кнопка с тремя точками */
        .icon-btn {
            background: var(--surface-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-btn:hover {
            border-color: var(--accent);
            background-color: #1e2636;
        }

        /* Рабочая область */
        .app-workspace {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            padding: 24px 32px;
            height: calc(100vh - 64px);
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        /* Карточки с плавной геометрией */
        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-outer);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .id-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .id-box {
            background-color: var(--surface-elevated);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: var(--radius-inner);
            font-family: ui-monospace, monospace;
            font-size: 13px;
            color: var(--text-main);
            user-select: all;
        }

        /* Инпуты и кнопки */
        input[type="text"] {
            background-color: var(--surface-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: var(--radius-inner);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-inner);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-danger {
            background-color: rgba(255, 77, 79, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 77, 79, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            background-color: rgba(255, 77, 79, 0.25);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Видео сетка */
        .video-grid {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 16px;
            flex-grow: 1;
            min-height: 0;
        }

        .video-wrapper {
            background-color: #040609;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-outer);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background-color: rgba(6, 8, 12, 0.7);
            backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-label img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Чат */
        .chat-card {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-container {
            flex-grow: 1;
            background-color: var(--surface-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-inner);
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
        }

        .message-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 85%;
        }

        .message-item.self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-header-info {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message-header-info img {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            object-fit: cover;
        }

        .bubble {
            background-color: #212c40;
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.4;
            word-break: break-word;
            border: 1px solid var(--border-color);
        }

        .message-item.self .bubble {
            background-color: var(--accent);
            border-color: transparent;
            color: #fff;
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        /* Модальное окно настроек */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-outer);
            width: 440px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.open .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-elevated);
            padding: 12px 16px;
            border-radius: var(--radius-inner);
            border: 1px solid var(--border-color);
            font-size: 14px;
        }

        /* Кастомный чекбокс */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color);
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-section">
            <img id="header-avatar" class="brand-logo" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" alt="Avatar">
            <div class="brand-title" id="header-nickname">Nexus Node</div>
        </div>
        <div class="header-right">
            <div class="system-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Инициализация...</span>
            </div>
            <button class="icon-btn" id="btn-settings-toggle" title="Настройки и профиль">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="5" r="2"/>
                    <circle cx="12" cy="12" r="2"/>
                    <circle cx="12" cy="19" r="2"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-workspace">
        <!-- Левая колонка: Управление и Потоки -->
        <div class="column">
            <div class="card">
                <div class="id-row">
                    <span>Ваш ID узла:</span>
                    <span class="id-box" id="my-id">Генерация...</span>
                </div>
                <div class="control-panel">
                    <input type="text" id="target-id" placeholder="Введите ID собеседника..." autocomplete="off">
                    <button class="btn" id="btn-call" disabled>Вызов</button>
                </div>
            </div>

            <div class="video-grid">
                <div class="video-wrapper">
                    <div class="video-label">
                        <img id="local-label-avatar" src="" alt="">
                        <span id="local-label-name">Вы</span>
                    </div>
                    <video id="local-video" autoplay muted playsinline></video>
                </div>
                <div class="video-wrapper">
                    <div class="video-label">Собеседник</div>
                    <video id="remote-video" autoplay playsinline></video>
                </div>
            </div>

            <div>
                <button class="btn btn-danger" id="btn-hangup" disabled style="width: 100%;">Завершить сессию</button>
            </div>
        </div>

        <!-- Правая колонка: Чат -->
        <div class="column">
            <div class="card chat-card">
                <div class="card-title">Защищенный чат узла</div>
                <div class="messages-container" id="messages-container">
                    <div class="message-item">
                        <div class="bubble" style="color: var(--text-secondary); background: transparent; border: 1px dashed var(--border-color);">Система готова. Ожидание подключения...</div>
                    </div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Введите сообщение..." disabled>
                    <button class="btn" id="btn-send" disabled>Отпр.</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Модальное окно настроек и профиля -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <span>Настройки и профиль</span>
                <button class="modal-close" id="btn-modal-close">&times;</button>
            </div>

            <div class="setting-group">
                <span class="setting-label">Ваш никнейм</span>
                <input type="text" id="input-nickname" placeholder="Введите ник...">
            </div>

            <div class="setting-group">
                <span class="setting-label">Ссылка на аватарку (URL)</span>
                <input type="text" id="input-avatar" placeholder="https://example.com/avatar.jpg">
            </div>

            <div class="setting-group">
                <span class="setting-label">Аудио и связь</span>
                <div class="toggle-row">
                    <span>Аппаратное шумоподавление</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-noise" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <button class="btn" id="btn-save-settings" style="width: 100%; margin-top: 10px;">Сохранить настройки</button>
        </div>
    </div>

    <script>
        class NexusNodeApp {
            constructor() {
                this.peer = null;
                this.localStream = null;
                this.currentCall = null;
                this.dataConnection = null;

                this.profile = {
                    nickname: localStorage.getItem('nexus_nick') || 'User_' + Math.floor(Math.random() * 899 + 100),
                    avatar: localStorage.getItem('nexus_avatar') || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100',
                    noiseSuppression: localStorage.getItem('nexus_noise') !== 'false'
                };

                this.initDOM();
                this.applyProfileToUI();
                this.initPeer();
                this.initMedia();
                this.initEvents();
            }

            initDOM() {
                this.dom = {
                    myId: document.getElementById('my-id'),
                    targetId: document.getElementById('target-id'),
                    btnCall: document.getElementById('btn-call'),
                    btnHangup: document.getElementById('btn-hangup'),
                    localVideo: document.getElementById('local-video'),
                    remoteVideo: document.getElementById('remote-video'),
                    messagesContainer: document.getElementById('messages-container'),
                    chatInput: document.getElementById('chat-input'),
                    btnSend: document.getElementById('btn-send'),
                    statusDot: document.getElementById('status-dot'),
                    statusText: document.getElementById('status-text'),
                    
                    headerAvatar: document.getElementById('header-avatar'),
                    headerNickname: document.getElementById('header-nickname'),
                    localLabelAvatar: document.getElementById('local-label-avatar'),
                    localLabelName: document.getElementById('local-label-name'),
                    
                    settingsModal: document.getElementById('settings-modal'),
                    btnSettingsToggle: document.getElementById('btn-settings-toggle'),
                    btnModalClose: document.getElementById('btn-modal-close'),
                    btnSaveSettings: document.getElementById('btn-save-settings'),
                    inputNickname: document.getElementById('input-nickname'),
                    inputAvatar: document.getElementById('input-avatar'),
                    toggleNoise: document.getElementById('toggle-noise')
                };
            }

            applyProfileToUI() {
                this.dom.headerAvatar.src = this.profile.avatar;
                this.dom.headerNickname.textContent = this.profile.nickname;
                this.dom.localLabelAvatar.src = this.profile.avatar;
                this.dom.localLabelName.textContent = this.profile.nickname + ' (Вы)';

                this.dom.inputNickname.value = this.profile.nickname;
                this.dom.inputAvatar.value = this.profile.avatar;
                this.dom.toggleNoise.checked = this.profile.noiseSuppression;
            }

            initPeer() {
                this.peer = new Peer({
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                this.peer.on('open', id => {
                    this.dom.myId.textContent = id;
                    this.setStatus(true, 'Узел активен');
                    this.dom.btnCall.disabled = false;
                });

                this.peer.on('error', err => {
                    this.setStatus(false, `Ошибка: ${err.type}`);
                });

                this.peer.on('call', call => {
                    this.currentCall = call;
                    call.answer(this.localStream || new MediaStream());
                    this.bindCallEvents(call);
                });

                this.peer.on('connection', conn => {
                    this.setupDataConnection(conn);
                });
            }

            async initMedia() {
                try {
                    if (this.localStream) {
                        this.localStream.getTracks().forEach(track => track.stop());
                    }

                    this.localStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: {
                            noiseSuppression: this.profile.noiseSuppression,
                            echoCancellation: true,
                            autoGainControl: true
                        }
                    });
                    this.dom.localVideo.srcObject = this.localStream;
                } catch (e) {
                    this.setStatus(false, 'Камера/микрофон недоступны');
                }
            }

            initEvents() {
                // Настройки модалка
                this.dom.btnSettingsToggle.addEventListener('click', () => {
                    this.dom.settingsModal.classList.add('open');
                });
                this.dom.btnModalClose.addEventListener('click', () => {
                    this.dom.settingsModal.classList.remove('open');
                });
                this.dom.settingsModal.addEventListener('click', (e) => {
                    if (e.target === this.dom.settingsModal) {
                        this.dom.settingsModal.classList.remove('open');
                    }
                });

                this.dom.btnSaveSettings.addEventListener('click', async () => {
                    this.profile.nickname = this.dom.inputNickname.value.trim() || 'NexusUser';
                    this.profile.avatar = this.dom.inputAvatar.value.trim() || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100';
                    const newNoise = this.dom.toggleNoise.checked;

                    localStorage.setItem('nexus_nick', this.profile.nickname);
                    localStorage.setItem('nexus_avatar', this.profile.avatar);
                    localStorage.setItem('nexus_noise', newNoise);

                    this.applyProfileToUI();
                    this.dom.settingsModal.classList.remove('open');

                    if (this.profile.noiseSuppression !== newNoise) {
                        this.profile.noiseSuppression = newNoise;
                        await this.initMedia();
                    }
                });

                // Звонки и чат
                this.dom.btnCall.addEventListener('click', () => {
                    const id = this.dom.targetId.value.trim();
                    if (!id) return;

                    this.dom.btnCall.disabled = true;
                    this.dom.targetId.disabled = true;
                    this.setStatus(true, 'Подключение...');

                    const call = this.peer.call(id, this.localStream || new MediaStream());
                    this.currentCall = call;
                    this.bindCallEvents(call);

                    const conn = this.peer.connect(id);
                    this.setupDataConnection(conn);
                });

                this.dom.btnHangup.addEventListener('click', () => this.terminate());

                this.dom.btnSend.addEventListener('click', () => this.sendMessage());
                this.dom.chatInput.addEventListener('keypress', e => {
                    if (e.key === 'Enter') this.sendMessage();
                });
            }

            bindCallEvents(call) {
                call.on('stream', remoteStream => {
                    this.dom.remoteVideo.srcObject = remoteStream;
                    this.dom.btnHangup.disabled = false;
                    this.setStatus(true, 'Сессия защищена');
                });
                call.on('close', () => this.terminate());
                call.on('error', () => this.terminate());
            }

            setupDataConnection(conn) {
                this.dataConnection = conn;
                conn.on('open', () => {
                    this.dom.chatInput.disabled = false;
                    this.dom.btnSend.disabled = false;
                    this.addSystemMessage('Защищенный канал чата установлен.');
                });
                conn.on('data', data => {
                    this.appendMessage(data.text, data.time, false, data.sender);
                    this.playNotificationSound();
                });
                conn.on('close', () => {
                    this.addSystemMessage('Собеседник закрыл чат.');
                });
            }

            sendMessage() {
                const text = this.dom.chatInput.value.trim();
                if (!text || !this.dataConnection) return;

                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const payload = {
                    text,
                    time,
                    sender: {
                        nickname: this.profile.nickname,
                        avatar: this.profile.avatar
                    }
                };

                this.dataConnection.send(payload);
                this.appendMessage(text, time, true, payload.sender);
                this.dom.chatInput.value = '';
            }

            appendMessage(text, time, isSelf, sender) {
                const div = document.createElement('div');
                div.className = `message-item ${isSelf ? 'self' : ''}`;
                
                const name = isSelf ? 'Вы' : (sender?.nickname || 'Собеседник');
                const avatar = isSelf ? this.profile.avatar : (sender?.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100');

                div.innerHTML = `
                    <div class="message-header-info">
                        <img src="${avatar}" alt="">
                        <span>${this.escape(name)} • ${time}</span>
                    </div>
                    <div class="bubble">${this.escape(text)}</div>
                `;
                this.dom.messagesContainer.appendChild(div);
                this.dom.messagesContainer.scrollTop = this.dom.messagesContainer.scrollHeight;
            }

            addSystemMessage(text) {
                const div = document.createElement('div');
                div.className = 'message-item';
                div.innerHTML = `<div class="bubble" style="color: var(--text-secondary); background: transparent; border: 1px dashed var(--border-color);">${this.escape(text)}</div>`;
                this.dom.messagesContainer.appendChild(div);
                this.dom.messagesContainer.scrollTop = this.dom.messagesContainer.scrollHeight;
            }

            playNotificationSound() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.18);
                } catch(e) {}
            }

            terminate() {
                if (this.currentCall) { this.currentCall.close(); this.currentCall = null; }
                if (this.dataConnection) { this.dataConnection.close(); this.dataConnection = null; }

                this.dom.remoteVideo.srcObject = null;
                this.dom.btnCall.disabled = false;
                this.dom.targetId.disabled = false;
                this.dom.btnHangup.disabled = true;
                this.dom.chatInput.disabled = true;
                this.dom.btnSend.disabled = true;
                this.setStatus(true, 'Узел активен');
            }

            setStatus(active, text) {
                if (active) this.dom.statusDot.classList.add('active');
                else this.dom.statusDot.classList.remove('active');
                this.dom.statusText.textContent = text;
            }

            escape(str) {
                return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new NexusNodeApp();
        });
    </script>
</body>
</html>
