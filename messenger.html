<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacon — Enterprise P2P Suite</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            /* Абсолютно нейтральная монохромная палитра (R=G=B везде) */
            --bg-body: #0a0a0a;
            --bg-sidebar: #121212;
            --bg-main: #181818;
            --bg-modal: #181818;
            --bg-element: #222222;
            --bg-hover: #2a2a2a;
            
            --border-light: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.35);
            
            --accent-primary: #f0f0f0;
            --accent-hover: #ffffff;
            
            --text-primary: #ffffff;
            --text-secondary: #adadad;
            --text-muted: #757575;
            
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 6px;
            
            --inertia-easing: cubic-bezier(0.16, 1, 0.3, 1);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #454545; }

        .fade-in {
            animation: fadeIn 0.4s var(--inertia-easing) forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .app-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-light);
            z-index: 10;
        }

        .brand-block { display: flex; align-items: center; gap: 12px; }
        .brand { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
        .connection-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #757575; transition: background 0.3s; }
        .connection-status-dot.online { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }

        .header-actions { display: flex; align-items: center; gap: 16px; }
        
        .btn-text {
            background: none; border: none; color: var(--text-secondary);
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: color 0.2s; padding: 6px 10px; border-radius: var(--radius-sm);
        }
        .btn-text:hover { color: var(--text-primary); background: var(--bg-element); }

        .profile-trigger {
            display: flex; align-items: center; gap: 10px;
            padding: 4px 12px 4px 4px; background: var(--bg-element);
            border: 1px solid var(--border-light); border-radius: 30px;
            cursor: pointer; transition: all 0.2s;
        }
        .profile-trigger:hover { background: var(--bg-hover); border-color: var(--border-focus); }
        .profile-trigger img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .profile-trigger span { font-size: 13px; font-weight: 600; color: var(--text-primary); }

        /* Workspace */
        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px; padding: 20px 28px 28px;
            height: calc(100vh - 64px);
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            display: flex; flex-direction: column;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .sidebar-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; }
        
        .friends-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
        
        .friend-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; background: transparent;
            border-radius: var(--radius-md); border: 1px solid transparent;
            cursor: pointer; transition: all 0.2s;
        }
        .friend-item:hover { background: var(--bg-element); border-color: var(--border-light); }
        .friend-meta { display: flex; align-items: center; gap: 12px; }
        .friend-meta img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
        .friend-meta .name { font-size: 13px; font-weight: 500; color: var(--text-primary); }

        /* Main View */
        .main-view { display: flex; flex-direction: column; gap: 20px; }

        .panel {
            background: var(--bg-main);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .call-area {
            height: 240px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden; padding: 20px;
        }
        .video-container { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        .video-circle {
            width: 80px; height: 80px; border-radius: 50%; background: #000;
            border: 2px solid var(--border-light); overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); position: relative;
        }
        .video-circle video { width: 100%; height: 100%; object-fit: cover; }
        .video-label {
            position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            font-size: 9px; background: rgba(0,0,0,0.7); padding: 1px 6px; border-radius: 4px; color: #fff;
        }
        
        .call-controls { display: flex; gap: 10px; width: 100%; max-width: 480px; justify-content: center; }
        
        .input-base {
            background: var(--bg-element); border: 1px solid var(--border-light);
            color: var(--text-primary); padding: 10px 16px; border-radius: var(--radius-md);
            font-size: 13px; font-family: inherit; outline: none; 
            transition: all 0.2s;
        }
        .input-base::placeholder { color: var(--text-muted); }
        .input-base:focus { border-color: var(--border-focus); background: var(--bg-hover); }
        
        .btn-primary {
            background: var(--accent-primary); color: #0a0a0a;
            border: none; padding: 10px 20px; border-radius: var(--radius-md);
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 4px 15px rgba(255,255,255,0.15); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; background: var(--bg-element); color: var(--text-muted); }

        .btn-danger { background: #262626; color: #f87171; border: 1px solid var(--border-light); }
        .btn-danger:hover:not(:disabled) { background: #363636; color: #fca5a5; }

        /* Chat Area */
        .chat-area {
            flex-grow: 1; display: flex; flex-direction: column;
            padding: 20px; overflow: hidden; max-height: calc(100vh - 360px);
        }
        .messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; padding-right: 6px; }
        .msg { max-width: 70%; padding: 10px 16px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.4; word-break: break-word; }
        .msg.in { background: var(--bg-element); border: 1px solid var(--border-light); align-self: flex-start; color: var(--text-primary); }
        .msg.out { background: var(--accent-primary); color: #0a0a0a; align-self: flex-end; font-weight: 500; }
        
        .chat-input-wrapper { display: flex; gap: 10px; }
        .chat-input-wrapper .input-base { flex-grow: 1; }
        
        .btn-icon {
            width: 42px; height: 42px; border-radius: var(--radius-md); background: var(--accent-primary);
            color: #0a0a0a; border: none; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .btn-icon:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-icon:disabled { background: var(--bg-element); color: var(--text-muted); cursor: not-allowed; }

        /* Модальные окна с мощным блюром фона */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .settings-window {
            background: var(--bg-modal);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl); 
            width: 920px; height: 640px;
            display: flex; overflow: hidden;
            box-shadow: 0 30px 70px rgba(0,0,0,0.85);
            transform: scale(0.96); transition: transform 0.25s var(--inertia-easing);
        }
        .modal-overlay.open .settings-window { transform: scale(1); }

        .set-sidebar {
            width: 240px; background: rgba(0,0,0,0.3);
            border-right: 1px solid var(--border-light); padding: 24px 16px;
            display: flex; flex-direction: column; gap: 24px;
        }
        .set-user-mini { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
        .set-user-mini img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
        .set-user-mini span { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        
        .set-nav-group { display: flex; flex-direction: column; gap: 4px; }
        .set-nav-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; padding-left: 10px; margin-bottom: 4px; letter-spacing: 0.5px; }
        .set-nav-item {
            padding: 9px 12px; border-radius: var(--radius-sm); color: var(--text-secondary);
            font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .set-nav-item:hover { background: var(--bg-element); color: var(--text-primary); }
        .set-nav-item.active { background: var(--bg-element); color: var(--text-primary); border: 1px solid var(--border-light); }

        .set-content { flex-grow: 1; padding: 32px; position: relative; overflow-y: auto; }
        .set-pane { display: none; }
        .set-pane.active { display: block; }
        
        .set-header { font-size: 20px; font-weight: 600; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; color: var(--text-primary); }
        
        .close-modal { 
            background: none; border: none; color: var(--text-muted); 
            font-size: 20px; cursor: pointer; transition: color 0.2s; 
            width: 36px; height: 36px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
        }
        .close-modal:hover { color: var(--text-primary); background: var(--bg-element); }

        .ds-profile-card {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-light);
            border-radius: var(--radius-lg); width: 360px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); position: relative;
        }
        
        .ds-banner {
            height: 120px; background-color: #262626; background-size: cover; background-position: center;
            position: relative; display: flex; justify-content: flex-end; padding: 10px;
        }
        
        .ds-avatar-wrap {
            position: absolute; top: 76px; left: 16px;
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--bg-main); padding: 4px;
        }
        .ds-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #262626; }
        
        .edit-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
            opacity: 0; cursor: pointer; transition: opacity 0.2s; border-radius: inherit;
        }
        .ds-banner:hover .edit-overlay, .ds-avatar-wrap:hover .edit-overlay { opacity: 1; }
        .edit-overlay input[type="file"] { display: none; }
        .edit-overlay svg { color: white; width: 20px; height: 20px; }

        .ds-info { padding: 48px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
        .ds-field { 
            background: var(--bg-element); border: 1px solid var(--border-light); 
            color: var(--text-primary); padding: 8px 12px; border-radius: var(--radius-sm); 
            font-size: 13px; outline: none; transition: all 0.2s; width: 100%; font-family: inherit;
        }
        .ds-field:focus { border-color: var(--border-focus); background: var(--bg-hover); }
        .ds-field.title { font-size: 17px; font-weight: 700; background: transparent; border: 1px solid transparent; padding: 4px; margin-bottom: -6px; }
        .ds-field.title:focus { border-color: var(--border-light); background: var(--bg-element); }
        .ds-field.tag { font-size: 12px; color: var(--text-secondary); background: transparent; border: 1px solid transparent; padding: 4px; }
        .ds-field.tag:focus { border-color: var(--border-light); background: var(--bg-element); color: var(--text-primary); }
        
        .id-copy-block {
            margin-top: 6px; padding: 12px; background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-light); border-radius: var(--radius-sm);
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            transition: all 0.2s;
        }
        .id-copy-block:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
        .id-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .id-value { font-size: 12px; font-family: monospace; color: var(--text-primary); margin-top: 2px; }

        .settings-form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .settings-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
        .settings-select {
            background: var(--bg-element); border: 1px solid var(--border-light);
            color: var(--text-primary); padding: 10px 14px; border-radius: var(--radius-md);
            font-size: 13px; font-family: inherit; outline: none; width: 100%; cursor: pointer;
        }
        .settings-select:focus { border-color: var(--border-focus); }

        .incoming-call-modal {
            background: var(--bg-modal); border: 1px solid var(--border-light);
            border-radius: var(--radius-xl); padding: 32px; text-align: center;
            width: 340px; box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }
        .caller-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 16px; border: 2px solid var(--border-light); }
        .caller-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; color: var(--text-primary); }
        .caller-status { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
        .inc-actions { display: flex; gap: 12px; justify-content: center; }
        .btn-circle { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn-circle:hover { transform: scale(1.08); }
        .btn-accept { background: var(--accent-primary); color: #0a0a0a; }
        .btn-reject { background: #262626; color: #f87171; border: 1px solid var(--border-light); }
    </style>
</head>
<body>

    <header class="app-header fade-in" style="animation-delay: 0.05s;">
        <div class="brand-block">
            <div class="connection-status-dot" id="connection-dot" title="Статус PeerJS"></div>
            <div class="brand">Bacon</div>
        </div>
        <div class="header-actions">
            <button class="btn-text" id="nav-add-friend">Add Friend</button>
            <div class="profile-trigger" id="nav-profile">
                <img id="header-avatar" src="" alt="Avatar">
                <span id="header-nickname">User</span>
            </div>
        </div>
    </header>

    <main class="workspace">
        <div class="sidebar fade-in" style="animation-delay: 0.1s;">
            <div class="sidebar-header">
                <div class="sidebar-title">Direct Connections</div>
            </div>
            <div class="friends-list" id="friends-list"></div>
        </div>

        <div class="main-view fade-in" style="animation-delay: 0.15s;">
            <div class="panel call-area">
                <div class="video-container">
                    <div class="video-circle">
                        <video id="local-video" autoplay muted playsinline></video>
                        <div class="video-label">You</div>
                    </div>
                    <div class="video-circle">
                        <video id="remote-video" autoplay playsinline></video>
                        <div class="video-label">Peer</div>
                    </div>
                </div>
                <div class="call-controls">
                    <input type="text" id="target-id" class="input-base" placeholder="Enter remote Peer ID..." style="flex-grow: 1;">
                    <button class="btn-primary" id="btn-call">Call</button>
                    <button class="btn-primary btn-danger" id="btn-hangup" disabled>End</button>
                </div>
            </div>

            <div class="panel chat-area">
                <div class="messages" id="messages-container">
                    <div class="msg in" style="background: transparent; border: 1px dashed var(--border-light); color: var(--text-muted); text-align: center; width: 100%; max-width: 100%;">Сеть инициализирована. Введите Peer ID выше для начала связи.</div>
                </div>
                <div class="chat-input-wrapper">
                    <input type="text" id="chat-input" class="input-base" placeholder="Type a message..." disabled>
                    <button class="btn-icon" id="btn-send" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Окно настроек -->
    <div class="modal-overlay" id="settings-modal">
        <div class="settings-window">
            <div class="set-sidebar">
                <div class="set-user-mini">
                    <img id="side-avatar" src="" alt="">
                    <span id="side-nickname">User</span>
                </div>
                <div class="set-nav-group">
                    <div class="set-nav-title">User Settings</div>
                    <div class="set-nav-item active" data-tab="profile">Profile</div>
                    <div class="set-nav-item" data-tab="devices">Audio / Video</div>
                </div>
            </div>
            
            <div class="set-content">
                <!-- Вкладка Профиль -->
                <div class="set-pane active" id="pane-profile">
                    <div class="set-header">
                        <span>Profile Settings</span>
                        <button class="close-modal" id="close-settings">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                    
                    <div class="ds-profile-card">
                        <div class="ds-banner" id="prof-banner-bg">
                            <label class="edit-overlay">
                                <input type="file" id="upload-banner" accept="image/*">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                            </label>
                        </div>
                        <div class="ds-avatar-wrap">
                            <img class="ds-avatar" id="prof-avatar-img" src="">
                            <label class="edit-overlay" style="border-radius: 50%;">
                                <input type="file" id="upload-avatar" accept="image/*">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                            </label>
                        </div>
                        <div class="ds-info">
                            <input type="text" id="prof-nick-input" class="ds-field title" placeholder="Nickname">
                            <input type="text" id="prof-tag-input" class="ds-field tag" placeholder="@username">
                            <textarea id="prof-bio-input" class="ds-field" rows="2" placeholder="About me..." style="resize: none;"></textarea>
                            
                            <div class="id-copy-block" id="btn-copy-id" title="Нажмите, чтобы скопировать Peer ID">
                                <div>
                                    <div class="id-label">Ваш Peer ID</div>
                                    <div class="id-value" id="display-my-id">Генерация...</div>
                                </div>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </div>
                        </div>
                    </div>
                    
                    <button class="btn-primary" id="btn-save-profile" style="margin-top: 24px;">Save Changes</button>
                </div>

                <!-- Вкладка Устройства -->
                <div class="set-pane" id="pane-devices">
                    <div class="set-header">
                        <span>Audio & Video Devices</span>
                        <button class="close-modal" id="close-settings-2">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                    <div class="settings-form-group">
                        <label class="settings-label">Camera</label>
                        <select id="select-video" class="settings-select"></select>
                    </div>
                    <div class="settings-form-group">
                        <label class="settings-label">Microphone</label>
                        <select id="select-audio" class="settings-select"></select>
                    </div>
                    <button class="btn-primary" id="btn-apply-devices" style="margin-top: 12px;">Apply Devices</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно: Добавить друга -->
    <div class="modal-overlay" id="friend-modal">
        <div class="settings-window" style="width: 380px; height: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
            <div class="set-header" style="margin-bottom: 0; font-size: 17px;">
                <span>Add Connection</span>
                <button class="close-modal" id="close-friend"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            <input type="text" id="fr-id" class="input-base" placeholder="Peer ID">
            <input type="text" id="fr-name" class="input-base" placeholder="Display Name">
            <button class="btn-primary" id="btn-add-submit" style="width: 100%;">Save to List</button>
        </div>
    </div>

    <!-- Модальное окно: Входящий звонок -->
    <div class="modal-overlay" id="incoming-modal">
        <div class="incoming-call-modal">
            <img class="caller-avatar" id="inc-avatar" src="" alt="">
            <div class="caller-name" id="inc-name">Incoming Call</div>
            <div class="caller-status">wants to connect with you</div>
            
            <div class="inc-actions">
                <button class="btn-circle btn-reject" id="btn-inc-reject" title="Отклонить">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <button class="btn-circle btn-accept" id="btn-inc-accept" title="Принять">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        class P2PApp {
            constructor() {
                this.peer = null;
                this.myId = null;
                this.localStream = null;
                this.currentCall = null;
                this.dataConn = null;
                this.incomingCall = null;

                this.defaultAvatar = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200';
                this.defaultBanner = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600';

                this.loadUserData();
                this.initDOM();
                this.renderProfile();
                this.renderFriendsList();
                this.initPeerConnection();
                this.initMediaStream();
                this.initEventListeners();
            }

            loadUserData() {
                this.profile = JSON.parse(localStorage.getItem('bacon_prof')) || {
                    nick: 'Operator', tag: '@node_01', bio: '',
                    avatar: this.defaultAvatar, banner: this.defaultBanner
                };
                this.friends = JSON.parse(localStorage.getItem('bacon_fr')) || [];
            }

            saveUserData() {
                localStorage.setItem('bacon_prof', JSON.stringify(this.profile));
            }

            initDOM() {
                this.dom = {
                    headerAvatar: document.getElementById('header-avatar'),
                    headerNickname: document.getElementById('header-nickname'),
                    sideAvatar: document.getElementById('side-avatar'),
                    sideNickname: document.getElementById('side-nickname'),
                    connectionDot: document.getElementById('connection-dot'),
                    
                    profNick: document.getElementById('prof-nick-input'),
                    profTag: document.getElementById('prof-tag-input'),
                    profBio: document.getElementById('prof-bio-input'),
                    profAvatarImg: document.getElementById('prof-avatar-img'),
                    profBannerBg: document.getElementById('prof-banner-bg'),
                    
                    uploadAvatar: document.getElementById('upload-avatar'),
                    uploadBanner: document.getElementById('upload-banner'),
                    
                    displayMyId: document.getElementById('display-my-id'),
                    targetIdInput: document.getElementById('target-id'),
                    
                    localVideo: document.getElementById('local-video'),
                    remoteVideo: document.getElementById('remote-video'),
                    
                    btnCall: document.getElementById('btn-call'),
                    btnHangup: document.getElementById('btn-hangup'),
                    
                    chatInput: document.getElementById('chat-input'),
                    btnSend: document.getElementById('btn-send'),
                    messagesContainer: document.getElementById('messages-container'),
                    
                    selectVideo: document.getElementById('select-video'),
                    selectAudio: document.getElementById('select-audio'),
                    
                    modals: {
                        settings: document.getElementById('settings-modal'),
                        friend: document.getElementById('friend-modal'),
                        incoming: document.getElementById('incoming-modal')
                    }
                };
            }

            renderProfile() {
                this.dom.headerAvatar.src = this.profile.avatar;
                this.dom.headerNickname.textContent = this.profile.nick;
                this.dom.sideAvatar.src = this.profile.avatar;
                this.dom.sideNickname.textContent = this.profile.nick;
                
                this.dom.profNick.value = this.profile.nick;
                this.dom.profTag.value = this.profile.tag;
                this.dom.profBio.value = this.profile.bio;
                this.dom.profAvatarImg.src = this.profile.avatar;
                this.dom.profBannerBg.style.backgroundImage = `url('${this.profile.banner}')`;
            }

            initPeerConnection() {
                this.peer = new Peer({
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });

                this.peer.on('open', id => {
                    this.myId = id;
                    this.dom.displayMyId.textContent = id;
                    this.dom.connectionDot.classList.add('online');
                });

                this.peer.on('error', err => {
                    console.error('PeerJS error:', err);
                    this.dom.connectionDot.classList.remove('online');
                });

                // Входящий видеозвонок
                this.peer.on('call', call => {
                    this.incomingCall = call;
                    const meta = call.metadata || {};
                    document.getElementById('inc-name').textContent = meta.nick || 'Incoming Peer';
                    document.getElementById('inc-avatar').src = meta.avatar || this.defaultAvatar;
                    this.dom.modals.incoming.classList.add('open');
                });

                // Входящее дейта-соединение (чат)
                this.peer.on('connection', conn => {
                    this.setupDataConnection(conn);
                });
            }

            async initMediaStream(constraints = { video: true, audio: true }) {
                try {
                    if (this.localStream) {
                        this.localStream.getTracks().forEach(track => track.stop());
                    }
                    this.localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.dom.localVideo.srcObject = this.localStream;
                    await this.populateDeviceList();
                } catch (e) {
                    console.warn("Медиаустройства недоступны или заблокированы:", e);
                }
            }

            async populateDeviceList() {
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    this.dom.selectVideo.innerHTML = '';
                    this.dom.selectAudio.innerHTML = '';

                    devices.forEach(device => {
                        const opt = document.createElement('option');
                        opt.value = device.deviceId;
                        opt.text = device.label || `${device.kind}: ${device.deviceId.slice(0, 5)}...`;
                        if (device.kind === 'videoinput') {
                            this.dom.selectVideo.appendChild(opt);
                        } else if (device.kind === 'audioinput') {
                            this.dom.selectAudio.appendChild(opt);
                        }
                    });
                } catch(e) { console.error(e); }
            }

            initEventListeners() {
                // Открытие / закрытие модалок
                document.getElementById('nav-profile').onclick = () => this.dom.modals.settings.classList.add('open');
                document.getElementById('close-settings').onclick = () => this.dom.modals.settings.classList.remove('open');
                document.getElementById('close-settings-2').onclick = () => this.dom.modals.settings.classList.remove('open');
                
                document.getElementById('nav-add-friend').onclick = () => this.dom.modals.friend.classList.add('open');
                document.getElementById('close-friend').onclick = () => this.dom.modals.friend.classList.remove('open');

                // Переключение вкладок настроек
                document.querySelectorAll('.set-nav-item').forEach(item => {
                    item.onclick = (e) => {
                        document.querySelectorAll('.set-nav-item').forEach(i => i.classList.remove('active'));
                        document.querySelectorAll('.set-pane').forEach(p => p.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                        const targetPane = document.getElementById(`pane-${e.currentTarget.dataset.tab}`);
                        if (targetPane) targetPane.classList.add('active');
                    };
                });

                // Копирование ID
                document.getElementById('btn-copy-id').onclick = () => {
                    if (!this.myId) return;
                    navigator.clipboard.writeText(this.myId);
                    const el = this.dom.displayMyId;
                    const old = el.textContent;
                    el.textContent = "Скопировано в буфер!";
                    setTimeout(() => el.textContent = old, 2000);
                };

                // Загрузка аватара / баннера
                const handleFileUpload = (inputEl, isBanner) => {
                    inputEl.onchange = (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                if (isBanner) {
                                    this.profile.banner = ev.target.result;
                                    this.dom.profBannerBg.style.backgroundImage = `url('${ev.target.result}')`;
                                } else {
                                    this.profile.avatar = ev.target.result;
                                    this.dom.profAvatarImg.src = ev.target.result;
                                }
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                };
                handleFileUpload(this.dom.uploadAvatar, false);
                handleFileUpload(this.dom.uploadBanner, true);

                // Сохранение профиля
                document.getElementById('btn-save-profile').onclick = () => {
                    this.profile.nick = this.dom.profNick.value.trim() || 'Operator';
                    this.profile.tag = this.dom.profTag.value.trim() || '@node';
                    this.profile.bio = this.dom.profBio.value.trim();
                    this.saveUserData();
                    this.renderProfile();
                    this.dom.modals.settings.classList.remove('open');
                };

                // Применение устройств
                document.getElementById('btn-apply-devices').onclick = () => {
                    const videoId = this.dom.selectVideo.value;
                    const audioId = this.dom.selectAudio.value;
                    this.initMediaStream({
                        video: videoId ? { deviceId: { exact: videoId } } : true,
                        audio: audioId ? { deviceId: { exact: audioId } } : true
                    });
                    this.dom.modals.settings.classList.remove('open');
                };

                // Добавление контакта
                document.getElementById('btn-add-submit').onclick = () => {
                    const id = document.getElementById('fr-id').value.trim();
                    const name = document.getElementById('fr-name').value.trim() || 'Node';
                    if (!id) return;
                    this.friends.push({ id, name, avatar: this.defaultAvatar });
                    localStorage.setItem('bacon_fr', JSON.stringify(this.friends));
                    this.renderFriendsList();
                    document.getElementById('fr-id').value = '';
                    this.dom.modals.friend.classList.remove('open');
                };

                // Инициация звонка
                this.dom.btnCall.onclick = () => {
                    const targetId = this.dom.targetIdInput.value.trim();
                    if (!targetId || targetId === this.myId) return;

                    // Звонок по медиа
                    const call = this.peer.call(targetId, this.localStream, {
                        metadata: { nick: this.profile.nick, avatar: this.profile.avatar }
                    });
                    this.bindCallEvents(call);

                    // Соединение для чата
                    const conn = this.peer.connect(targetId);
                    this.setupDataConnection(conn);

                    this.dom.btnCall.disabled = true;
                };

                // Завершение звонка
                this.dom.btnHangup.onclick = () => this.terminateCall();

                // Принять / отклонить входящий звонок
                document.getElementById('btn-inc-accept').onclick = () => {
                    this.dom.modals.incoming.classList.remove('open');
                    if (this.incomingCall) {
                        this.incomingCall.answer(this.localStream);
                        this.bindCallEvents(this.incomingCall);
                        // Также коннектим дейта-канал к звонящему
                        const conn = this.peer.connect(this.incomingCall.peer);
                        this.setupDataConnection(conn);
                    }
                };

                document.getElementById('btn-inc-reject').onclick = () => {
                    this.dom.modals.incoming.classList.remove('open');
                    if (this.incomingCall) {
                        this.incomingCall.close();
                        this.incomingCall = null;
                    }
                };

                // Чат
                this.dom.btnSend.onclick = () => this.sendChatMessage();
                this.dom.chatInput.onkeypress = (e) => { if (e.key === 'Enter') this.sendChatMessage(); };
            }

            renderFriendsList() {
                const container = document.getElementById('friends-list');
                container.innerHTML = this.friends.length ? '' : '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:24px;">No contacts added.</div>';
                
                this.friends.forEach(f => {
                    const el = document.createElement('div');
                    el.className = 'friend-item';
                    el.innerHTML = `<div class="friend-meta"><img src="${f.avatar}"><span class="name">${f.name}</span></div>`;
                    el.onclick = () => { this.dom.targetIdInput.value = f.id; };
                    container.appendChild(el);
                });
            }

            bindCallEvents(call) {
                this.currentCall = call;
                this.dom.btnCall.disabled = true;
                this.dom.btnHangup.disabled = false;

                call.on('stream', remoteStream => {
                    this.dom.remoteVideo.srcObject = remoteStream;
                });

                call.on('close', () => this.terminateCall());
                call.on('error', () => this.terminateCall());
            }

            setupDataConnection(conn) {
                this.dataConn = conn;
                conn.on('open', () => {
                    this.dom.chatInput.disabled = false;
                    this.dom.btnSend.disabled = false;
                    this.appendMessage("Соединение установлено успешно.", false, true);
                });

                conn.on('data', data => {
                    if (data && data.text) {
                        this.appendMessage(data.text, false);
                    }
                });

                conn.on('close', () => {
                    this.dom.chatInput.disabled = true;
                    this.dom.btnSend.disabled = true;
                });
            }

            sendChatMessage() {
                const text = this.dom.chatInput.value.trim();
                if (!text || !this.dataConn) return;
                
                this.dataConn.send({ text });
                this.appendMessage(text, true);
                this.dom.chatInput.value = '';
            }

            appendMessage(text, isSelf, isSystem = false) {
                const c = this.dom.messagesContainer;
                const m = document.createElement('div');
                if (isSystem) {
                    m.className = 'msg in fade-in';
                    m.style.cssText = 'background:transparent; border:1px dashed var(--border-light); color:var(--text-muted); text-align:center; width:100%; max-width:100%;';
                } else {
                    m.className = `msg ${isSelf ? 'out' : 'in'} fade-in`;
                }
                m.textContent = text;
                c.appendChild(m);
                c.scrollTop = c.scrollHeight;
            }

            terminateCall() {
                if (this.currentCall) {
                    this.currentCall.close();
                    this.currentCall = null;
                }
                if (this.dataConn) {
                    this.dataConn.close();
                    this.dataConn = null;
                }
                this.dom.remoteVideo.srcObject = null;
                this.dom.btnCall.disabled = false;
                this.dom.btnHangup.disabled = true;
                this.dom.chatInput.disabled = true;
                this.dom.btnSend.disabled = true;
                this.appendMessage("Сеанс связи завершен.", false, true);
            }
        }

        window.onload = () => { window.p2pApp = new P2PApp(); };
    </script>
</body>
</html>
